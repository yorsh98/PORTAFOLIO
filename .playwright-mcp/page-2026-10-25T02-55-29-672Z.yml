      - paragraph [ref=e29]: 06 · Proyecto académico · Full stack
      - heading "ProviEmplea 2026" [level=1] [ref=e30]
      - paragraph [ref=e31]: "Plataforma de intermediación laboral municipal con búsqueda inversa: empresas validadas buscan talentos mediante CV protegidos y solicitan el contacto a través del Departamento de Empleo."
      - list [ref=e32]:
        - listitem [ref=e33]: Laravel
        - listitem [ref=e34]: Sanctum
        - listitem [ref=e35]: React
        - listitem [ref=e36]: TypeScript
        - listitem [ref=e37]: Inertia
        - listitem [ref=e38]: Tailwind CSS
        - listitem [ref=e39]: MySQL
        - listitem [ref=e40]: Swagger/OpenAPI
        - listitem [ref=e41]: Docker
        - listitem [ref=e42]: Ollama
      - figure [ref=e43]:
        - button "Ampliar imagen de ProviEmplea 2026" [ref=e44] [cursor=pointer]:
          - img "Portada pública de ProviEmplea 2026." [ref=e45]
    - generic [ref=e46]:
      - generic [ref=e47]:
        - article [ref=e48]:
          - text: "01"
          - heading "Objetivo" [level=2] [ref=e49]
          - paragraph [ref=e50]: Ordenar y digitalizar la intermediación laboral municipal (inscripción, perfilamiento, derivación y seguimiento) sin exponer datos personales de quienes buscan empleo.
        - article [ref=e51]:
          - text: "02"
          - heading "Solución" [level=2] [ref=e52]
          - paragraph [ref=e53]: "Tres portales sobre una misma API: personas completan su perfil y cargan su CV con consentimiento; empresas validadas revisan una vitrina de CV ciegos y piden contacto; el equipo municipal valida perfiles, gestiona solicitudes, deja notas internas y exporta reportes."
        - article [ref=e54]:
          - text: "03"
          - heading "Arquitectura" [level=2] [ref=e55]
          - paragraph [ref=e56]: Monorepo con backend y frontend separados. Una API REST Laravel versionada bajo /api/v1, autenticada con Bearer Token (Sanctum) y documentada con Swagger/OpenAPI, concentra reglas de privacidad, policies, auditoría y rate limiting. El frontend Laravel + React con Inertia y TypeScript consume la API mediante servicios tipados. El análisis de CV funciona con expresiones regulares por defecto, con Ollama local u OpenAI como opción configurable.
        - article [ref=e57]:
          - text: "04"
          - heading "Infraestructura" [level=2] [ref=e58]
          - paragraph [ref=e59]: Backend en Docker Compose con PHP-FPM, Nginx, MySQL, cola en base de datos, scheduler, Mailpit y LibreOffice para procesar documentos. El frontend se ejecuta con Vite. Incluye un widget de accesibilidad propio con opciones de texto, contraste y navegación.
        - article [ref=e60]:
          - text: "05"
          - heading "Alcance de publicación" [level=2] [ref=e61]
          - paragraph [ref=e62]: Proyecto académico desarrollado para una evaluación de IPSS; no es un sistema oficial de la Municipalidad de Providencia. Todas las capturas usan cuentas y datos de demostración.
